<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<body>
  <div class="wrapper">
    <header id="header" class="header">
      <!-- <a href="#popup" class="header_popup" ></a> -->
      <span class="logo">Kennel</span>
      <h1>Iz  Vladeniya  Akelo</h1>
      <img src="img/kennel.png" width="100" alt="kennel"/>
    </header>
    <main class="container">      
      <section class="section_content"> 
        <div class="content">
          <div class="info">
            <span class="letter">Dame:</span>
            <h2>Nuar-Di Iz Vladeniya Akelo</h2>
            <a href="#pdg-dame" class="button href_info">Pedigree</a>
            <!-- <button class="button" data-popup="pdg-dame">Pedigree</button> -->
            <a href="#test-dame" class="button href_info">Test</a>
          </div>
          <div class="image">
            <button class="foto">
              <img src="img/arrow-left.svg" width="20" alt="left"/>
            </button>
            <img class="dog" src="img/2.jpg" alt="Nura"/>
            <button class="foto">
              <img src="img/right-arrow.svg" width="20" alt="right"/>
            </button>
          </div>
        </div>
        <div class="content">
          <div class="info">
            <span class="letter">Sire:</span>
            <h2>Diamond Brave Heart Apricote Mood</h2>
            <a href="#pdg-sire" class="button href_info">Pedigree</a>
          </div>
          <div class="image">
            <button class="foto">
              <img src="img/arrow-left.svg" width="20" alt="left"/>
            </button>
            <img class="dog" src="img/sir3.jpg" alt="Sire"/>
            <button class="foto">
              <img src="img/right-arrow.svg" width="20" alt="right"/>
            </button>
          </div>
        </div>
      </section>              
      <section class="section">        
        <h2 class="puppies">Puppies new litter</h2>
        <span class="letter">date of birth: 05.05.2026</span>
        <div class="section_content">
          <div class="content">
            <div class="info">
              <h2>Females:</h2>
            </div>
            <div class="image">
              <button class="foto">
                <img src="img/arrow-left.svg" width="20" alt="left"/>
              </button>
              <img class="dog" src="img/rida1.jpg" alt="Rida"/>
              <button class="foto">
                <img src="img/right-arrow.svg" width="20" alt="right"/>
              </button>
            </div>
          </div>
          <div class="content">
          <div class="info">
            <h2>Males:</h2>
          </div>
          <div class="image">
            <button class="foto">
              <img src="img/arrow-left.svg" width="20" alt="left"/>
            </button>
            <img class="dog" src="img/mal3.34.jpg" alt="Overt"/>
            <button class="foto">
              <img src="img/right-arrow.svg" width="20" alt="right"/>
            </button>
          </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="contact">
        <img src="img/icon-phone.svg" width="35" alt="phone"/>
        <span class="contact-info">+38 063 602 2482</span>
      </div>
      <div class="contact">
        <img src="img/icon-email.svg" width="35" alt="email"/>
        <span class="contact-info">iii888jji@gmail.com</span>
      </div>
      <div class="contact">
        <img src="img/icon-marker.png" width="20" alt="phone"/>
        <span class="contact-info">Borova, Kyiv reg.,<br/>Ukraine 08520</span>
      </div>
    </footer>      
  </div>
